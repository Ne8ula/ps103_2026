# Defaults for every project. Override per project in <project>/config.yaml or via TUTORIALGEN_* env vars.
# Sections not listed here fall back to the defaults of the stage's own config model.

device: cpu              # cpu | cuda — heavy stages (perception, transcribe, render) read this

llm:
  provider: auto         # auto: openai if OPENAI_API_KEY, else gemini if GEMINI_API_KEY, else fake
                         # | openai | gemini | ollama | chat (any OpenAI-compatible base_url) | fake
  model: null            # null = provider default: gpt-5.4-mini (openai), gemini-3.6-flash (gemini)
  replay: false          # true = answer only from llm_cache, never call a model (demos)
  max_images_per_call: 6
  timeout_s: 120

embeddings:
  provider: local        # local (fastembed) | openai | hash (tests only, no download)
  model: BAAI/bge-small-en-v1.5

segment:
  window_s: 300          # one window covers short videos: fewer LLM calls (free tiers allow ~20/day/model)
  max_candidates_per_window: 40

use_gesture_text: true   # false = segment/draft prompts omit gesture text (ablation for M9)
